name: Frontend CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# id-token lets the job assume the AWS role github-actions-ecr-push without any stored key.
permissions:
  id-token: write
  contents: read

env:
  IMAGE: 894665396429.dkr.ecr.eu-north-1.amazonaws.com/erp-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # A pull request only builds; publishing and deploying happen on a push to master. The
      # workflow used to deploy pull requests too, i.e. put unmerged code on the live site.
      - name: Build (pull request check)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          cache-from: type=gha

      # Images live in the company's own AWS account (ECR, eu-north-1) since 2026-10-19; before
      # that they were on the previous developer's Docker Hub account.
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::894665396429:role/github-actions-ecr-push
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to the server
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@master
        env:
          IMAGE: ${{ env.IMAGE }}
        with:
          envs: IMAGE
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # Pull the new image; the server signs in to ECR with its IAM role (credential helper)
            docker pull ${IMAGE}:latest

            # Stop and remove old container
            docker stop erp-frontend || true
            docker rm erp-frontend || true

            # Run new container.
            # Publish on the docker bridge gateway only, not 0.0.0.0: iums-nginx sits on the
            # compose network and reaches this container through host.docker.internal, which
            # resolves to 172.17.0.1. Binding there keeps nginx working while taking the
            # plain-HTTP copy of the app off the internet.
            docker run -d \
              --name erp-frontend \
              --restart unless-stopped \
              -p 172.17.0.1:5000:5000 \
              ${IMAGE}:latest

            # The port is no longer reachable from the runner, so check it from the server.
            sleep 5
            curl -fsS -o /dev/null http://172.17.0.1:5000/health && echo "erp-frontend reachable from the bridge gateway"

            # Clean up old images
            docker image prune -af --filter "until=24h"

            # Show running containers
            docker ps

      - name: Verify deployment
        if: github.event_name == 'push'
        run: |
          # Check the path real users take (nginx -> erp-frontend), not the raw container port:
          # that port is bound to the docker bridge gateway and is unreachable from here.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null --max-time 15 https://jafaiums.uz/; then
              echo "https://jafaiums.uz/ is serving the app"
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          echo "jafaiums.uz did not serve the app after the deploy"
          exit 1
